    post:
      operationId: search_createCortexSearchService
      summary: Create a cortex search service
      description: Create a cortex search service, with standard create modifiers as query parameters. See the Cortex Search
        Service component definition for what is required to be provided in the request body.
      tags:
      - cortex-search-service
      parameters:
      - name: database
        description: Identifier (i.e. name) for the database to which the resource belongs. You can use the `/api/v2/databases`
