        description: Identifier (i.e. name) for the database to which the resource belongs. You can use the `/api/v2/databases`
          GET request to get a list of available databases.
        required: true
        in: path
        schema:
          type: object
          additionalProperties: true
        x-ms-summary: Database
      - name: schema
        description: Identifier (i.e. name) for the schema to which the resource belongs. You can use the `/api/v2/databases/{database}/schemas`
          GET request to get a list of available schemas for the specified database.
        required: true
        in: path
        schema:
          type: object
          additionalProperties: true
        x-ms-summary: Schema
      - name: like
        description: Parameter to filter the command output by resource name. Uses case-insensitive pattern matching, with
          support for SQL wildcard characters.
        in: query
        schema:
          type: string
        x-ms-summary: Like
      - name: fromName
        description: Parameter to enable fetching rows only following the first row whose object name matches the specified
          string. Case-sensitive and does not have to be the full name.
        in: query
        schema:
          type: string
        x-ms-summary: Fromname
      - name: showLimit
        description: Parameter to limit the maximum number of rows returned by a command.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
        x-ms-summary: Showlimit
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: Response
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '408':
          description: Response
        '409':
          description: Response
        '410':
          description: Response
        '429':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
