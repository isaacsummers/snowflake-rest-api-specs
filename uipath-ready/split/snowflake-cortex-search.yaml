        required: true
        in: path
        schema:
          type: object
          additionalProperties: true
        x-ms-summary: Schema
      - name: createMode
        description: 'Parameter allowing support for different modes of resource creation. Possible values include:

          - `errorIfExists`: Throws an error if you try to create a resource that already exists.

          - `orReplace`: Automatically replaces the existing resource with the current one.

          - `ifNotExists`: Creates a new resource when an alter is requested for a non-existent resource.'
        in: query
        schema:
          type: string
          enum:
          - errorIfExists
          - orReplace
          - ifNotExists
          default: errorIfExists
        x-ms-summary: Createmode
      requestBody:
        required: true
        content:
