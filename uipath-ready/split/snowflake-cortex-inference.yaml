openapi: 3.0.0
info:
  title: Snowflake Cortex Inference API
  version: 2.0.0
  description: 'Snowflake Cortex LLM inference endpoints. Includes: inference:complete, inference:embed, /models list, OpenAI-compat
    chat/completions, Anthropic-compat messages.'
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
servers:
- url: https://{account}.snowflakecomputing.com
  description: Snowflake account endpoint
  variables:
    account:
      default: MDTPLC-AWSUSE1P1
      description: Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1). No '.snowflakecomputing.com' suffix.
      x-ms-connection-parameter:
        name: account
        uiDefinition:
          displayName: Snowflake Account
          description: Your Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1)
          tooltip: Find under Admin > Accounts or run SELECT CURRENT_ACCOUNT() in Snowflake
          constraints:
            required: 'true'
security:
- SnowflakeOAuth:
  - session:role:DEV_FDH_PROJ_MGMT_RW
tags: []
paths:
  /api/v2/cortex/models:
    get:
      summary: Returns the LLMs available for the current session
      tags:
      - cortex-inference
      description: Returns the LLMs available for the current session
      operationId: inference_getModels
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Returns the LLMs available for the current session
    parameters:
    - &id001
      $ref: '#/components/parameters/SnowflakeAuthorizationTokenType'
    - &id002
      $ref: '#/components/parameters/SnowflakeRole'
    - &id003
      $ref: '#/components/parameters/SnowflakeWarehouse'
    - &id004
      $ref: '#/components/parameters/SnowflakeDatabase'
    - &id005
      $ref: '#/components/parameters/SnowflakeSchema'
  /api/v2/cortex/inference:complete:
    post:
      summary: Perform LLM text completion inference.
      tags:
      - cortex-inference
      description: Perform LLM text completion inference, similar to snowflake.cortex.Complete.
      operationId: inference_cortexLLMInferenceComplete
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Perform LLM text completion inference.
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
  /api/v2/cortex/inference:embed:
    post:
      summary: Perform LLM embed
      tags:
      - cortex-embed
      description: 'Perform LLM embedding for input text, similar to the Snowflake Cortex `EMBED_TEXT` functions.

        For more details on available functions, see:

        - [EMBED_TEXT_768](https://docs.snowflake.com/en/sql-reference/functions/embed_text-snowflake-cortex)

        - [EMBED_TEXT_1024](https://docs.snowflake.com/en/sql-reference/functions/embed_text_1024-snowflake-cortex)'
      operationId: embed_embed
      requestBody:
        description: Request payload containing model identifier and input text.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK - Successfully generated embeddings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Perform LLM embed
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
  /api/v2/cortex/v1/chat/completions:
    post:
      summary: Perform LLM text completion inference using Cortex Chat Completions API format.
      tags:
      - cortex-generic-openai
      description: Perform LLM text completion inference using Chat Completions API format.
      operationId: generic_openai_cortexGenericOpenAIChatCompletions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Perform LLM text completion inference using Cortex Chat Completions API format.
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
  /api/v2/cortex/v1/messages:
    post:
      summary: Perform LLM text completion inference using Cortex Messages API format.
      tags:
      - cortex-generic-anthropic
      description: Perform LLM text completion inference using Cortex Messages API format.
      operationId: generic_anthropic_cortexGenericAnthropicMessages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Perform LLM text completion inference using Cortex Messages API format.
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
components:
  securitySchemes:
    SnowflakeOAuth:
      type: oauth2
      description: 'Snowflake OAuth 2.0 Authorization Code. Configure client ID/secret from your Snowflake OAuth integration.
        Scope: session:role:<ROLE>.'
      flows:
        authorizationCode:
          authorizationUrl: https://orgname-accountname.snowflakecomputing.com/oauth/authorize
          tokenUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-request
          refreshUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-request
          x-ms-authorization-url: https://{account}.snowflakecomputing.com/oauth/authorize
          x-ms-token-url: https://{account}.snowflakecomputing.com/oauth/token-request
          x-ms-refresh-url: https://{account}.snowflakecomputing.com/oauth/token-request
          x-ms-revoke-url: https://{account}.snowflakecomputing.com/oauth/token-revoke
          x-tokenRevocationUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-revoke
          scopes:
            session:role:PUBLIC: Access Snowflake with the PUBLIC role
          x-ms-connection-parameter:
            name: token
            uiDefinition:
              displayName: OAuth Scope
              description: 'Snowflake session scope. Format: session:role:<ROLE_NAME>'
              tooltip: Enter the role you want to use, e.g. session:role:MY_ROLE
              constraints:
                required: 'true'
  parameters:
    SnowflakeAuthorizationTokenType:
      name: X-Snowflake-Authorization-Token-Type
      in: header
      required: true
      description: Snowflake authorization token type. For OAuth use OAUTH; for PAT use PROGRAMMATIC_ACCESS_TOKEN.
      x-ms-visibility: advanced
      x-ms-summary: Token Type
      schema:
        type: string
        enum:
        - OAUTH
        - PROGRAMMATIC_ACCESS_TOKEN
        - KEYPAIR_JWT
        default: OAUTH
    SnowflakeRole:
      name: X-Snowflake-Role
      in: header
      required: false
      description: Snowflake role to use for the request.
      x-ms-visibility: advanced
      x-ms-summary: Role
      schema:
        type: string
        default: DEV_FDH_PROJ_MGMT_RW
      x-ms-connection-parameter:
        name: role
        uiDefinition:
          displayName: Default Role
          description: Default role sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeWarehouse:
      name: X-Snowflake-Warehouse
      in: header
      required: false
      description: Snowflake warehouse to use.
      x-ms-visibility: advanced
      x-ms-summary: Warehouse
      schema:
        type: string
        default: AGENT_WH
      x-ms-connection-parameter:
        name: warehouse
        uiDefinition:
          displayName: Default Warehouse
          description: Default warehouse sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeDatabase:
      name: X-Snowflake-Database
      in: header
      required: false
      description: Default Snowflake database context.
      x-ms-visibility: advanced
      x-ms-summary: Default Database
      schema:
        type: string
        default: DEV_FDH_DB
      x-ms-connection-parameter:
        name: database
        uiDefinition:
          displayName: Default Database
          description: Default database sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeSchema:
      name: X-Snowflake-Schema
      in: header
      required: false
      description: Default Snowflake schema context.
      x-ms-visibility: advanced
      x-ms-summary: Default Schema
      schema:
        type: string
        default: PROJ_MGMT
      x-ms-connection-parameter:
        name: schema
        uiDefinition:
          displayName: Default Schema
          description: Default schema sent with every request unless overridden per-call.
          constraints:
            required: 'false'
  schemas: {}
