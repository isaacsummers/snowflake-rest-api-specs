openapi: 3.0.0
info:
  title: Snowflake SQL API
  version: 2.0.0
  description: 'Snowflake SQL API — execute SQL statements asynchronously. Endpoints: submit statement, get results, cancel.'
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
servers:
- url: https://{account}.snowflakecomputing.com
  description: Snowflake account endpoint
  variables:
    account:
      default: MDTPLC-AWSUSE1P1
      description: Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1). No '.snowflakecomputing.com' suffix.
      x-ms-connection-parameter:
        name: account
        uiDefinition:
          displayName: Snowflake Account
          description: Your Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1)
          tooltip: Find under Admin > Accounts or run SELECT CURRENT_ACCOUNT() in Snowflake
          constraints:
            required: 'true'
security:
- SnowflakeOAuth:
  - session:role:DEV_FDH_PROJ_MGMT_RW
tags: []
paths:
  /api/v2/statements:
    parameters:
    - &id001
      $ref: '#/components/parameters/SnowflakeAuthorizationTokenType'
    - &id002
      $ref: '#/components/parameters/SnowflakeRole'
    - &id003
      $ref: '#/components/parameters/SnowflakeWarehouse'
    - &id004
      $ref: '#/components/parameters/SnowflakeDatabase'
    - &id005
      $ref: '#/components/parameters/SnowflakeSchema'
    post:
      operationId: sqlapi_SubmitStatement
      summary: Submits a SQL statement for execution.
      description: Submits one or more statements for execution. You can specify that the statement should be executed asynchronously.
      tags:
      - statements
      requestBody:
        required: true
        description: Specifies the SQL statement to execute and the statement context.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              statement: select * from T where c1=?
              timeout: 10
              database: TESTDB
              schema: TESTSCHEMA
              warehouse: TESTWH
              bindings:
                '1':
                  type: FIXED
                  value: '123'
      responses:
        '200':
          description: The statement was executed successfully, and the response includes any data requested.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          links:
            GetStatementStatus:
              operationId: GetStatementStatus
              parameters:
                statementHandle: $response.body#/resultMetaData.statementHandle
            CancelStatement:
              operationId: CancelStatement
              parameters:
                statementHandle: $response.body#/resultMetaData.statementHandle
        '202':
          description: The execution of the statement is still in progress. Use GET /statements/ and specify the statement
            handle to check the status of the statement execution.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '408':
          description: The execution of the statement exceeded the timeout period. The execution of the statement was cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '415':
          description: Response
        '422':
          description: An error occurred when executing the statement. Check the error code and error message for details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Submits a SQL statement for execution.
  /api/v2/statements/{statementHandle}:
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    get:
      operationId: sqlapi_GetStatementStatus
      summary: Checks the status of the execution of a statement
      description: Checks the status of the execution of the statement with the specified statement handle. If the statement
        was executed successfully, the operation returns the requested partition of the result set.
      tags:
      - statements
      responses:
        '200':
          description: The statement was executed successfully, and the response includes any data requested.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: The execution of the statement is still in progress. Use this method again to check the status of the
            statement execution.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '415':
          description: Response
        '422':
          description: An error occurred when executing the statement. Check the error code and error message for details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          description: Response
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Checks the status of the execution of a statement
  /api/v2/statements/{statementHandle}/cancel:
    parameters:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    post:
      operationId: sqlapi_CancelStatement
      summary: Cancels the execution of a statement.
      description: Cancels the execution of the statement with the specified statement handle.
      tags:
      - statements
      responses:
        '200':
          description: The execution of the statement was successfully canceled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Response
        '401':
          description: Response
        '403':
          description: Response
        '404':
          description: Response
        '405':
          description: Response
        '422':
          description: An error occurred when cancelling the execution of the statement. Check the error code and error message
            for details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          description: Response
        '503':
          description: Response
        '504':
          description: Response
      x-ms-summary: Cancels the execution of a statement.
components:
  securitySchemes:
    SnowflakeOAuth:
      type: oauth2
      description: 'Snowflake OAuth 2.0 Authorization Code. Configure client ID/secret from your Snowflake OAuth integration.
        Scope: session:role:<ROLE>.'
      flows:
        authorizationCode:
          authorizationUrl: https://orgname-accountname.snowflakecomputing.com/oauth/authorize
          tokenUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-request
          refreshUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-request
          x-ms-authorization-url: https://{account}.snowflakecomputing.com/oauth/authorize
          x-ms-token-url: https://{account}.snowflakecomputing.com/oauth/token-request
          x-ms-refresh-url: https://{account}.snowflakecomputing.com/oauth/token-request
          x-ms-revoke-url: https://{account}.snowflakecomputing.com/oauth/token-revoke
          x-tokenRevocationUrl: https://orgname-accountname.snowflakecomputing.com/oauth/token-revoke
          scopes:
            session:role:PUBLIC: Access Snowflake with the PUBLIC role
          x-ms-connection-parameter:
            name: token
            uiDefinition:
              displayName: OAuth Scope
              description: 'Snowflake session scope. Format: session:role:<ROLE_NAME>'
              tooltip: Enter the role you want to use, e.g. session:role:MY_ROLE
              constraints:
                required: 'true'
  parameters:
    SnowflakeAuthorizationTokenType:
      name: X-Snowflake-Authorization-Token-Type
      in: header
      required: true
      description: Snowflake authorization token type. For OAuth use OAUTH; for PAT use PROGRAMMATIC_ACCESS_TOKEN.
      x-ms-visibility: advanced
      x-ms-summary: Token Type
      schema:
        type: string
        enum:
        - OAUTH
        - PROGRAMMATIC_ACCESS_TOKEN
        - KEYPAIR_JWT
        default: OAUTH
    SnowflakeRole:
      name: X-Snowflake-Role
      in: header
      required: false
      description: Snowflake role to use for the request.
      x-ms-visibility: advanced
      x-ms-summary: Role
      schema:
        type: string
        default: DEV_FDH_PROJ_MGMT_RW
      x-ms-connection-parameter:
        name: role
        uiDefinition:
          displayName: Default Role
          description: Default role sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeWarehouse:
      name: X-Snowflake-Warehouse
      in: header
      required: false
      description: Snowflake warehouse to use.
      x-ms-visibility: advanced
      x-ms-summary: Warehouse
      schema:
        type: string
        default: AGENT_WH
      x-ms-connection-parameter:
        name: warehouse
        uiDefinition:
          displayName: Default Warehouse
          description: Default warehouse sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeDatabase:
      name: X-Snowflake-Database
      in: header
      required: false
      description: Default Snowflake database context.
      x-ms-visibility: advanced
      x-ms-summary: Default Database
      schema:
        type: string
        default: DEV_FDH_DB
      x-ms-connection-parameter:
        name: database
        uiDefinition:
          displayName: Default Database
          description: Default database sent with every request unless overridden per-call.
          constraints:
            required: 'false'
    SnowflakeSchema:
      name: X-Snowflake-Schema
      in: header
      required: false
      description: Default Snowflake schema context.
      x-ms-visibility: advanced
      x-ms-summary: Default Schema
      schema:
        type: string
        default: PROJ_MGMT
      x-ms-connection-parameter:
        name: schema
        uiDefinition:
          displayName: Default Schema
          description: Default schema sent with every request unless overridden per-call.
          constraints:
            required: 'false'
  schemas: {}
