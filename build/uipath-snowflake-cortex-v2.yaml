        based on the whether the privileges had been re-granted to another role.

        - restrict: If the privilege being revoked has been re-granted to another role, the REVOKE command
        fails.

        - cascade: If the privilege being revoked has been re-granted, the REVOKE command recursively
        revokes these dependent grants. If the same privilege on an object has been granted to the target
        role by a different grantor (parallel grant), that grant is not affected and the target role retains
        the privilege.'
      in: query
      schema:
        type: string
        enum:
        - restrict
        - cascade
        example: restrict
