      description: Suggest from a Cortex Search Service to get auto-complete or contextual suggestions
      tags:
      - cortex-search-service
      parameters:
      - $ref: '#/components/parameters/database'
      - $ref: '#/components/parameters/schema'
      - in: path
        name: service_name
        required: true
        schema:
          type: string
        description: The name of the Cortex Search Service
      requestBody:
        required: true
