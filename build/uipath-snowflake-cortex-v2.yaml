      required:
      - content
    MessageContent:
      type: object
      properties:
        type: &id017
          type: string
          enum:
          - text
          - sql
          - suggestions
          - results
          - chart
    MessageContentTextObject:
      title: Text
      type: object
      description: The text content that is part of a message.
      properties:
        type: *id017
        text:
          type: string
          example: To answer the question "What is the profit per store?" we must aggregate sales at the
            store level
      required:
      - text
    MessageContentSqlObject:
      title: SQL
      type: object
      description: The SQL content that is part of a message.
      properties:
        type: *id017
        statement:
          type: string
          description: The executable SQL statement
          example: SELECT store, SUM(profit) FROM sales GROUP BY store
        confidence:
          $ref: '#/components/schemas/Confidence'
      required:
      - statement
    MessageContentSuggestionsObject:
      title: Suggested Questions
      type: object
      description: If SQL cannot be generated, a list of questions the semantic model can generate SQL
        for.
      properties:
        type: *id017
        suggestions:
          type: array
          items:
            type: string
            example: What is the lifetime revenue for the top 5 clients?
      required:
      - suggestions
    MessageContentResultsObject:
      title: Results
      type: object
      description: Query ID of the executed query
      properties:
        type: *id017
        query_id:
          type: string
      required:
      - query_id
    MessageContentChartObject:
      title: Chart
      type: object
      description: The chart specification that is part of a message.
      properties:
        type: *id017
        chart_spec:
          type: string
      required:
      - chart_spec
    SendMessageRequest:
      type: object
      description: The request object for sendMessage requests
      properties:
        semantic_model_file:
          type: string
          description: The path to a file stored in a Snowflake Stage holding the semantic model yaml.
            Must be a fully qualified stage url
          example: '@db.schema.stage/path/to/file.yaml'
        semantic_model:
          type: string
          description: A string containing the entire semantic model yaml
          example: 'name: my_semantic_model\ntables:\n  - name: orders\n...'
        semantic_view:
          type: string
          description: The name of the Snowflake native semantic model object
          example: db.schema.semantic_view
        semantic_models:
          type: array
          description: A list of semantic model objects. If set, other semantic model properties are ignored
          items:
            $ref: '#/components/schemas/SemanticModelObject'
        stream:
          type: boolean
          description: Whether to stream the response or not
          default: false
        operation:
          type: string
          enum:
          - sql_generation
          - answer_generation
          description: Whether to response with SQL or natural language. One of 'sql_generation' or 'answer_generation'
          default: sql_generation
        warehouse:
          type: string
          description: Warehouse name to use for result set handling. Only used when 'operation' is 'answer_generation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageObject'
        source:
          type: string
          description: an optional field to specify the source of the request. e.g "eval", "prod"
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
        semantic_sql:
          type: string
          enum:
          - auto
          - require
          - disable
          description: Controls semantic SQL generation behavior. 'auto' (default) uses the current cascade
            behavior, 'require' forces semantic SQL, 'disable' disables it entirely.
      required:
      - messages
    Confidence:
      type: object
      description: The verified query the response is based on
      properties:
        verified_query_used:
          $ref: '#/components/schemas/VerifiedQuery'
    VerifiedQuery:
      type: object
      description: VerifiedQuery represents a (question, sql) pair that has been manually verified (e.g.
        by an analyst) to be correct.
      properties:
        name:
          type: string
          description: A name for this verified query. Mainly used for display purposes.
        question:
          type: string
          description: The question being answered.
        sql:
          type: string
          description: The correct SQL query for answering the question.
        verified_at:
          type: integer
          format: int64
          description: Timestamp at which the query was last verified - measures in seconds since epoch,
            in UTC.
        verified_by:
          type: string
          description: Name of the person who verified this query.
    SemanticModelSelection:
      type: object
      properties:
        index:
          description: The index of the selected semantic model
          type: integer
          format: int32
        identifier:
          $ref: '#/components/schemas/SemanticModelObject'
    SendMessageResponse:
      type: object
      description: The non-streaming response object for the sendMessage
      properties:
        message:
          $ref: '#/components/schemas/MessageObject'
        request_id:
          type: string
          description: Unique request ID
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        semantic_model_selection:
          $ref: '#/components/schemas/SemanticModelSelection'
        response_metadata:
          type: object
          additionalProperties: true
      required:
      - message
    Warning:
      type: object
      title: The warning object
      description: Represents a warning within a chat.
      properties:
        message:
          type: string
          description: A human-readable message describing the warning
    TokenInfo:
      type: object
      properties:
        token:
          type: string
        expiration_seconds:
          type: integer
    StatusUpdate:
      type: object
      properties:
        status:
          description: The latest status for processing the request
          type: string
        status_message:
          description: A human readable description on the current request processing status
          type: string
        request_id:
          type: string
          description: Unique request ID.
      required:
      - status
    MessageContentDelta:
      type: object
      properties:
        type: &id018
          type: string
        index: &id019
          type: integer
          description: The index of the content array this delta object represents
    MessageContentDeltaTextObject:
      title: Text
      type: object
      description: The text content that is part of a message.
      properties:
        type: *id018
        index: *id019
        text_delta:
          type: string
          description: The delta of the text content, clients should concatenate all deltas for the same
            index
          example: To answer the question "What is the profit per store?" we must aggregate sales at the
            store level
      required:
      - text_delta
    MessageContentDeltaThinkObject:
      title: Think
      type: object
      description: The think content that is part of a message.
      properties:
        type: *id018
        index: *id019
        think_delta:
          type: string
          description: The delta of the think content, clients should concatenate all deltas for the same
            index
          example: To answer the question "What is the profit per store?" we must aggregate sales at the
            store level
      required:
      - think_delta
    MessageContentDeltaSqlObject:
      title: SQL
      type: object
      description: The SQL content that is part of a message.
      properties:
        type: *id018
        index: *id019
        statement_delta:
          type: string
          description: The delta of the sql statement, clients should concatenate all deltas for the same
            index
          example: SELECT store, SUM(profit) FROM sales GROUP BY store
        confidence:
          $ref: '#/components/schemas/Confidence'
      required:
      - statement_delta
    MessageContentDeltaSuggestionsObject:
      title: Suggested Questions
      type: object
      description: If SQL cannot be generated, a list of questions the semantic model can generate SQL
        for.
      properties:
        type: *id018
        index: *id019
        suggestions_delta:
          $ref: '#/components/schemas/SuggestionDelta'
      required:
      - suggestions_delta
    SuggestionDelta:
      type: object
      properties:
        index:
          type: integer
          description: The index of the suggestions array this delta object represents
        suggestion_delta:
          type: string
          description: The delta of a suggestion text, clients should concatenate all deltas for the same
            index
    Warnings:
      type: object
      description: Represents a wrapper schema around Warning for streaming case
      properties:
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    SendFeedbackRequest:
      type: object
      description: The request object for sending user feedback on Cortex Analyst responses
      properties:
        request_id:
          type: string
          description: Request id associated with the feedback
        positive:
          type: boolean
          description: Whether the response was good (true) or bad (false)
        feedback_message:
          type: string
          description: The text for the detailed feedback message
      required:
      - request_id
      - positive
    GenerateVerifiedQuerySuggestionsRequest:
      type: object
      description: The request object for getting VQ suggestions
      properties:
        mode:
          type: string
          enum:
          - ca_requests_based
          - query_history_based
          description: Whether to generate suggestions based on historical CA requests or all SQL queries.
            One of 'ca_requests_based' or 'query_history_based'
          default: ca_requests_based
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableColumns'
        tds_source:
          type: array
          items:
            $ref: '#/components/schemas/TdsInput'
        sql_source:
          $ref: '#/components/schemas/SqlInputs'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        offset:
          description: The suggestions offset index, offset = 0 indicates the first call
          type: integer
          format: int32
        limit:
          description: The number of suggestions to return starting from the provided offset value
          type: integer
          format: int32
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - warehouse
    GenerateVerifiedQuerySuggestionsResponse:
      type: object
      description: The non-streaming response object for the VQ Suggestions request
      properties:
        request_id:
          type: string
          description: Unique request ID
        vq_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedQuerySuggestion'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    VerifiedQuerySuggestion:
      type: object
      description: A suggestion to add or remove or replace a Verified Query to a semantic model.
      properties:
        score:
          type: number
          description: Score of the suggestion, higher is better.
          format: float
        vq_to_add:
          $ref: '#/components/schemas/VerifiedQuery'
        vq_to_remove:
          $ref: '#/components/schemas/VerifiedQuery'
        metadata:
          type: object
          description: Arbitrary metadata associated with this suggestion.
          additionalProperties: true
    FastGenerationRequest:
      type: object
      description: The request for the FastGeneration rpc
      properties:
        json_proto:
          type: object
          description: A JSON-mapped FastGenerationRequest protobuf
          additionalProperties: true
    FastGenerationResponse:
      type: object
      description: The response for the FastGeneration rpc (streamed)
      properties:
        json_proto:
          type: object
          description: A JSON-mapped FastGenerationResponse protobuf
          additionalProperties: true
    PreSelectionRequest:
      type: object
      description: The request for the PreSelection rpc
      properties:
        tds_source:
          type: array
          items:
            $ref: '#/components/schemas/TdsInput'
        sql_source:
          $ref: '#/components/schemas/SqlInputs'
        warehouse:
          type: string
          description: Warehouse name to use for processing.
        tableau_input:
          $ref: '#/components/schemas/TableauInput'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - tds_source
      - warehouse
    PreSelectionResponse:
      type: object
      description: The response for the PreSelection rpc
      properties:
        request_id:
          type: string
          description: Unique request ID
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableColumns'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    TdsInput:
      type: object
      description: Tableau data source file stage paths
      properties:
        tds_stage_path:
          type: string
          description: TDS file stage path
        tds_file_content:
          type: string
          description: TDS file raw contents
      required:
      - tds_stage_path
    TableColumns:
      type: object
      description: Contains information about table and column names
      properties:
        database:
          type: string
          description: Database name
        schema:
          type: string
          description: Schema name
        table:
          type: string
          description: Table name
        column_names:
          type: array
          items:
            type: string
            description: Column names
      required:
      - database
      - schema
      - table
      - column_names
    AnnotatedSqlQuery:
      type: object
      description: Contains a SQL query with optional context and natural language annotation
      properties:
        sql_text:
          type: string
          description: SQL query text
        database:
          type: string
          description: Database associated with the SQL query
        schema:
          type: string
          description: Schema associated with the SQL query
        corresponding_question:
          type: string
          description: Natural language question that the SQL query answers
        additional_context:
          type: string
          description: Free-form string for additional context about the query
      required:
      - sql_text
    SqlInputs:
      type: object
      description: Contains SQL queries which may be annotated with natural language
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/AnnotatedSqlQuery'
      required:
      - queries
    CreateAgenticOptimizationRequest:
      type: object
      description: A request to start an agentic optimization run for a semantic model. Note that only
        semantic views and semantic model files are supported. Inline semantic models will lead to a 400
        response.
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - semantic_model
    CreateAgenticOptimizationResponse:
      type: object
      description: The result of starting an agentic optimization run for a semantic model.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimization_name:
          type: string
          description: The fully-qualified name of the created optimization run.
          example: some_db.some_schema."Some_Optimziation_Name_1234567890"
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    GetAgenticOptimizationResponse:
      type: object
      description: The status, state, and outcome of a specified agentic optimization run.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        status:
          $ref: '#/components/schemas/AgenticOptimizationStatus'
        state:
          type: string
          description: An opaque string containing the state of the optimization.
          example: '{"progress": 0.5, "details": "Halfway through the optimization"}'
        outcome:
          type: string
          description: An opaque string containing the outcome of the optimization, separate from the
            state. This should be the JSON-encoded form of an AgenticOptimizationOutcome protobuf message.
          example: '{"extensions": ""}'
        base_semantic_view_name:
          type: string
          description: The fully-qualified name of the base semantic model. This can be either a semantic
            view FQN (e.g., 'DB.SCHEMA.VIEW') or a stage file path (e.g., '@STAGE/path/file.yaml').
          example: MY_DB.MY_SCHEMA.MY_SEMANTIC_VIEW
    ListAgenticOptimizationsRequest:
      type: object
      description: A request to list all agentic optimization runs for a given base model. Note that only
        semantic views and semantic model files are supported. Inline semantic models will lead to a 400
        response.
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - semantic_model
    ListAgenticOptimizationsResponse:
      type: object
      description: The response from listing agentic optimization runs.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimizations:
          type: array
          items:
            $ref: '#/components/schemas/AgenticOptimizationSummary'
    AgenticOptimizationSummary:
      type: object
      description: A summary of an agentic optimization run.
      properties:
        optimization_name:
          type: string
          description: The fully-qualified name of the optimization.
        status:
          $ref: '#/components/schemas/AgenticOptimizationStatus'
    AgenticOptimizationStatus:
      type: string
      description: The status of an agentic optimization run.
      enum:
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      - CANCELED
    CreateAnalystEvalOptimizationRequest:
      type: object
      description: A request to create an analyst evaluation optimization for a semantic view. This creates
        a lightweight optimization without GRPC processing, used for evaluation and observability purposes.
      properties:
        semantic_view:
          type: string
          description: Fully qualified name of the semantic view for the eval.
          example: DATABASE.SCHEMA.SEMANTIC_VIEW
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - semantic_view
    CreateAnalystEvalOptimizationResponse:
      type: object
      description: The result of creating an analyst evaluation optimization.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimization_name:
          type: string
          description: The fully-qualified name of the created optimization. Uses format SYSTEM_AI_OBS_ANALYST_EVAL_{view_name}.
          example: DATABASE.SCHEMA.SYSTEM_AI_OBS_ANALYST_EVAL_SEMANTIC_VIEW
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    GetAnalystEvalOptimizationRequest:
      type: object
      description: A request to retrieve the analyst eval optimization for a semantic view.
      properties:
        semantic_view:
          type: string
          description: Fully qualified name of the semantic view.
          example: DATABASE.SCHEMA.SEMANTIC_VIEW
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
      - semantic_view
    GetAnalystEvalOptimizationResponse:
      type: object
      description: The response from retrieving an analyst eval optimization for a semantic view.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimization_name:
          type: string
          description: The fully-qualified name of the analyst evaluation optimization. Uses format SYSTEM_AI_OBS_ANALYST_EVAL_{view_name}.
          example: DATABASE.SCHEMA.SYSTEM_AI_OBS_ANALYST_EVAL_SEMANTIC_VIEW
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    TableauInput:
      type: object
      description: Input required to extract data from Tableau. Tableau Cloud users can optionally provide
        integration data if files are not already uploaded
      properties:
        stage_files:
          $ref: '#/components/schemas/TableauStageFiles'
        server_files:
          $ref: '#/components/schemas/TableauServerFiles'
    TableauStageFiles:
      type: object
      description: Specifies stage paths of the Tableau files
      properties:
        stage_paths:
          type: array
          items:
            type: string
            description: The stage paths of where the Tableau file is stored
    TableauServerFiles:
      type: object
      description: Contains Tableau URLs to retrieve files from Tableau server and information around
        Tableau integration
      properties:
        tableau_urls:
          type: array
          items:
            type: string
            description: The URLs in Tableau to retrieve files from
        integration:
          $ref: '#/components/schemas/TableauIntegration'
    TableauIntegration:
      type: object
      description: Contains data on how to connect to Tableau and process data
      properties:
        auth:
          $ref: '#/components/schemas/TableauAuth'
        staging_data:
          $ref: '#/components/schemas/StagingData'
      required:
      - auth
      - staging_data
    GenerateFiltersAndMetricsSuggestionsRequest:
      type: object
      description: The request object for generating filters, facts, and metrics suggestions
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        tables:
          type: array
          description: Tables and selected columns to build a basic semantic model from
          items:
            $ref: '#/components/schemas/TableColumns'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        metrics_offset:
          type: integer
          format: int32
          description: Pagination offset for metrics suggestions
        metrics_limit:
          type: integer
          format: int32
          description: Pagination limit for metrics suggestions
        facts_offset:
          type: integer
          format: int32
          description: Pagination offset for facts suggestions
        facts_limit:
          type: integer
          format: int32
          description: Pagination limit for facts suggestions
        filters_offset:
          type: integer
          format: int32
          description: Pagination offset for filters suggestions
        filters_limit:
          type: integer
          format: int32
          description: Pagination limit for filters suggestions
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    GenerateFiltersAndMetricsSuggestionsResponse:
      type: object
      description: The response object for filters, facts, and metrics suggestions
      properties:
        request_id:
          type: string
          description: Unique request ID
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SemanticModelUpdateSuggestion'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    SemanticModelUpdateSuggestion:
      type: object
      description: A suggestion consisting of ordered semantic object changes with optional setup SQL
        and score.
      properties:
        changes:
          type: array
          description: Changes to be applied in order
          items:
            $ref: '#/components/schemas/SemanticModelChange'
        version:
          type: integer
          format: int32
          description: Version of SemanticModelUpdateSuggestion
        metadata:
          type: object
          description: Arbitrary metadata associated with this suggestion.
          additionalProperties: true
    SemanticModelChange:
      type: object
      description: A single change to apply to the semantic object
      properties:
        operation:
          $ref: '#/components/schemas/SemanticModelChangeOperation'
        path:
          type: string
          description: Path to the node in the semantic object to change
        value:
          $ref: '#/components/schemas/SemanticModelChangeValue'
      required:
      - operation
      - path
    SemanticModelChangeOperation:
      type: string
      description: Operation applied to a semantic object at a given path
      enum:
      - set
      - append
      - remove
    SemanticModelChangeValue:
      type: object
      description: One-of value. A map with exactly one key set corresponding to the semantic model object
        or primitive.
      additionalProperties: true
    TableauAuth:
      type: object
      description: Authentication required to connect to Tableau
      properties:
        secret_fqn:
          type: string
          description: The fully qualified name of the secret containing the Tableau PAT
        server_url:
          type: string
          description: The Tableau server name to send requests to
      required:
      - secret_fqn
      - server_url
    StagingData:
      type: object
      description: Contains information indicating where to stage data
      properties:
        database:
          type: string
          description: Database name
        schema:
          type: string
          description: Schema name
      required:
      - database
      - schema
    ExpandQueryRequest:
      type: object
      description: A request to expand logical SQL queries to physical SQL based on a semantic view
      required:
      - semantic_view
      - queries
      properties:
        semantic_view:
          type: string
          description: The fully qualified name of the semantic view
          example: MY_DB.MY_SCHEMA.MY_SEMANTIC_VIEW
        queries:
          type: array
          description: Array of SQL queries to expand from logical to physical
          items:
            type: string
          example:
          - SELECT revenue FROM sales
          - SELECT COUNT(*) FROM customers
    ExpandQueryResponse:
      type: object
      description: The response containing the expanded SQL queries. Results are returned in the same
        order as the input queries.
      properties:
        queries:
          type: array
          description: Array of expanded physical SQL queries
          items:
            type: string
    QueryRequest:
      type: object
      description: A search query and additional parameters for search.
      properties:
        query:
          description: Unstructured text query.  Exactly one of 'query' or 'multi_index_query' must be
            specified.
          type: string
        multi_index_query:
          description: A search query expressed as a collection of multiple column-level queries.  Exactly
            one of 'query' or 'multi_index_query' must be specified. A column/index can be queried with
            multiple queries.
          type: object
          additionalProperties: true
        columns:
          description: List of columns to return.
          type: array
          items:
            type: string
        filter:
          description: Filter query.
          type: object
        limit:
          description: Max number of results to return.
          type: integer
          default: 10
        scoring_config:
          $ref: '#/components/schemas/ScoringConfig'
        scoring_profile:
          description: Mutually exclusive with scoring_config. Specifies the pre-defined name of a profile
            on the cortex search service that resolves to scoring_config.
          type: string
        experimental:
          description: reserved
          type: object
          additionalProperties: true
    ScoringConfig:
      type: object
      description: reserved
      properties:
        functions:
          $ref: '#/components/schemas/Functions'
        reranker:
          $ref: '#/components/schemas/Reranker'
        weights:
          $ref: '#/components/schemas/Weights'
        retrieval_weights:
          $ref: '#/components/schemas/RetrievalWeights'
        ranking_weights:
          $ref: '#/components/schemas/RankingWeights'
        disable_vector_embedding_query_prefix:
          type: boolean
          description: whether to disable query prefix for embedding while searching
          default: false
        diversity:
          $ref: '#/components/schemas/Diversity'
    Weights:
      type: object
      description: Weights to apply to each scoring component.
      properties:
        texts:
          description: Weight to apply to all text-specific columns.
          type: number
          example: 0.5
        vectors:
          description: Weight to apply to all vector-specific columns.
          type: number
          example: 0.5
        reranker:
          description: Weight to apply to reranker-specific scoring component.
          type: number
          example: 0.5
    RetrievalWeights:
      type: object
      description: Weights to apply to retrieval stage components.
      properties:
        texts:
          description: Multiplier for text-based scoring in retrieval.
          type: number
          example: 1.0
        vectors:
          description: Multiplier for vector-based scoring in retrieval.
          type: number
          example: 1.0
    RankingWeights:
      type: object
      description: Weights to apply to ranking stage components.
      properties:
        texts:
          description: Multiplier for text-based scoring in ranking.
          type: number
          example: 1.0
        vectors:
          description: Multiplier for vector-based scoring in ranking.
          type: number
          example: 1.0
        reranker:
          description: Multiplier for reranker score in ranking.
          type: number
          example: 1.0
    Diversity:
      type: object
      description: Configuration to control result diversity with respect to one or more metadata columns.
      properties:
        group_by:
          description: Columns to group by.
          type: array
          items:
            type: string
        max_results:
          description: Maximum number of results per group to return.
          type: integer
    Functions:
      type: object
      description: Functions to apply for scoring this request.
      properties:
        numeric_boosts:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoost'
        time_decays:
          type: array
          items:
            $ref: '#/components/schemas/TimeDecay'
        text_boosts:
          type: array
          items:
            $ref: '#/components/schemas/TextBoost'
        vector_boosts:
          type: array
          items:
            $ref: '#/components/schemas/VectorBoost'
        query_similarity_boosts:
          type: array
          items:
            $ref: '#/components/schemas/QuerySimilarityBoost'
    Column:
      type: string
      description: Column to apply this function to.
    NumericBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          type: number
          description: Weight to apply for boosting this numerical column. It will be normalized across
            all scored columns specified in the scoring config so that all weights sum to 1. If a weight
            is not provided, the weight defaults to 1 pre-normalization.
          example: 0.5
      required:
      - column
    TimeDecay:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          type: number
          description: Weight to apply for decaying this timestamp column. Normalized across all scored
            columns in the scoring config so that all weights sum to 1. If a weight is not provided, the
            weight defaults to 1 pre-normalization.
          example: 0.5
        limit_hours:
          type: number
          description: Optional limit in hours after which the decay does not apply.
          example: 24
        now:
          type: string
          format: date-time
          description: Optional reference timestamp to calculate decay from.
          example: '2022-01-01T00:00:00Z'
      required:
      - column
    TextBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          description: Weight to apply for boosting this text column.
          type: number
          example: 0.5
    VectorBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          description: Weight to apply for boosting this vector column.
          type: number
          example: 0.5
        disable_vector_embedding_query_prefix:
          description: Whether to disable the embedding query prefix
          type: boolean
          default: false
    QuerySimilarityBoost:
      type: object
      properties:
        cortex_search_service:
          description: Fully-qualified name of a Cortex Search Service through which to find similar previous
            queries.
          type: string
          example: MY_DB.MY_SCHEMA.MY_SEARCH_SERVICE
        previous_query_column:
          description: Name of a TEXT column indexed in the specified previous queries search service
            that contains the previous query strings.
          type: string
        documents_column:
          description: Name of an ARRAY column indexed in the specified previous queries search service
            that contains a list of documents that matched the corresponding previous query. Each document
            is represented as an OBJECT mapping all primary key columns to their corresponding values.
          type: string
    Reranker:
      type: string
      description: Model to use for the reranker, or "none" if the reranker should be turned off. If excluded
        or null, the default reranker is used.
      example: none
    ColumnQuery:
      description: Query specification of a given column. Exactly one of 'text' or 'vector' must be specified.
      type: object
      properties:
        text:
          description: Unstructured text query for querying a text index.
          type: string
        vector:
          description: Query embedding vector. Must be computed using the same model as used for embedding
            the column being queried.
          type: array
          items:
            type: number
            format: float
    QueryResponse:
      type: object
      description: Search results.
      properties:
        results:
          type: array
          description: List of result rows.
          items:
            type: object
            additionalProperties: true
            description: Map of column names to values (as bytes).
        request_id:
          type: string
          description: ID of the request.
      required:
      - results
      - request_id
    ResultRow:
      type: object
      description: Map of column names to values.
      properties:
        columns:
          type: object
    SuggestQueryRequest:
      type: object
      description: A Suggest request.
      properties:
        query:
          description: The text query on which to suggest.
          type: string
        columns:
          description: List of columns to return.
          type: array
          items:
            type: string
        limit:
          description: Max number of results to return.
          type: integer
          default: 5
      required:
      - query
    SuggestResult:
      type: object
      description: Suggest results.
      properties:
        rows:
          type: array
          description: List of result rows.
          items:
            $ref: '#/components/schemas/ResultRow'
    SuggestQueryResponse:
      type: object
      description: Suggest results.
      properties:
        results:
          type: array
          description: List of result rows.
          items:
            $ref: '#/components/schemas/SuggestResult'
        request_id:
          type: string
          description: ID of the request.
      required:
      - results
      - request_id
    CortexSearchService:
      type: object
      description: A Snowflake cortex search service object.
      properties:
        name:
          type: string
          description: Specifies the name for the cortex search service, must be unique for the schema
            in which the cortex search service is created
        search_column:
          type: string
          description: Specifies the name of the search column for the cortex search service.
        columns:
          type: array
          items:
            type: string
          description: Specifies all columns included in the cortex search service and that can be returned
            in search queries.
        attribute_columns:
          type: array
          items:
            type: string
          description: Specifies the attribute columns, which can be referenced in filters in search queries
            to the cortex search service.
        target_lag:
          $ref: '#/components/schemas/TargetLag'
          description: Specifies the schedule for periodically refreshing the cortex search service.
        warehouse:
          type: string
          description: Specifies the name of the warehouse that provides the compute resources for refreshing
            the cortex search service
          example: test_wh
        definition:
          type: string
          description: Specifies the definition (source query) used to create the cortex search service
          example: SELECT col1, col2 FROM foo
        comment:
          type: string
          description: Specifies a comment for the cortex search service
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the cortex search service was created.
        database_name:
          type: string
          readOnly: true
          description: Database in which the cortex search service is stored
        schema_name:
          type: string
          readOnly: true
          description: Schema in which the cortex search service is stored
        source_data_num_rows:
          type: integer
          format: int64
          readOnly: true
          description: Number of rows in the materialized source data feeding into the cortex search service.
        data_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Date and time as of which data existent in base tables is now serving.
        indexing_state:
          $ref: '#/components/schemas/SchedulingState'
          description: Current state of the indexing pipeline for the cortex search service; one of 'SUSPENDED'
            or 'ACTIVE'.
        serving_state:
          $ref: '#/components/schemas/SchedulingState'
          description: Whether the cortex search service is currently actively serving; one of 'SUSPENDED'
            or 'ACTIVE'.
        indexing_error:
          type: string
          readOnly: true
          description: Error encountered during the latest indexing pipeline of the cortex search service,
            if any.
        serving_data_bytes:
          type: integer
          format: int64
          readOnly: true
          description: Size of the serving index, in bytes.
    SchedulingState:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - INITIALIZING
    GetModelsRequest:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
    GetModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
    CompleteRequest:
      type: object
      description: LLM text completion request.
      properties:
        model:
          description: The model name. See documentation for possible values.
          type: string
        anthropic:
          type: object
          description: Anthropic specific configuration.
          nullable: true
          properties:
            thinking:
              type: object
              description: Thinking configuration.
              nullable: true
              properties:
                budget_tokens:
                  type: integer
                  description: The budget for thinking tokens.
                  example: 2048
              required:
              - budget_tokens
        openai:
          type: object
          description: OpenAI specific configuration.
          nullable: true
          properties:
            reasoning:
              type: object
              description: Reasoning configuration.
              nullable: true
              properties:
                effort:
                  type: string
                  description: The effort level for reasoning.
                  enum:
                  - low
                  - medium
                  - high
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                description: "Indicates the role of the message, one of 'system', 'user' or 'assistant'.\n\
                  \nRules:\n  - A 'user' message must be the last message in the list.\n  - If a 'system'\
                  \ message is specified, it must be the first message.\n  - If a 'assistant' message\
                  \ is specified, it must be immediately before a 'user' message in the list.\n\nMultiple\
                  \ 'assistant' and 'user' messages can be specified, but they must alternate in sequence.\n"
                default: user
              content:
                type: string
                description: The text completion prompt, e.g. 'What is a Large Language Model?'.
              content_list:
                type: array
                description: Contents of text, toolUse, toolResults, or model-specific output
                items: {}
          minItems: 1
        temperature:
          description: Temperature controls the amount of randomness used in response generation. A higher
            temperature corresponds to more randomness.
          type: number
          nullable: true
          minimum: 0.0
        top_p:
          description: Threshold probability for nucleus sampling. A higher top-p value increases the
            diversity of tokens that the model considers, while a lower value results in more predictable
            output.
          type: number
          default: 1.0
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          description: The maximum number of output tokens to produce. The default value is model-dependent.
          type: integer
          default: 4096
          minimum: 0
        max_output_tokens:
          deprecated: true
          description: Deprecated in favor of "max_tokens", which has identical behavior.
          type: integer
          nullable: true
        response_format:
          type: object
          nullable: true
          description: An object describing response format config for structured-output mode.
          properties:
            type:
              type: string
              enum:
              - json
              description: The response format type (e.g., "json").
            schema:
              type: object
              description: The schema defining the structure of the response. If the `type` is "json",
                the `schema` field should contain a valid JSON schema.
        guardrails:
          $ref: '#/components/schemas/GuardrailsConfig'
        tools:
          description: List of tools to be used during tool calling
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        provisioned_throughput_id:
          type: string
          description: The provisioned throughput ID to be used with the request.
          nullable: true
        sf-ml-xp-inflight-prompt-action:
          type: string
          description: Reserved
        sf-ml-xp-inflight-prompt-client-id:
          type: string
          description: Reserved
        sf-ml-xp-inflight-prompt-public-key:
          type: string
          description: Reserved
        stream:
          type: boolean
          default: true
          nullable: true
          description: Reserved
      required:
      - model
      - messages
    GuardrailsConfig:
      type: object
      title: GuardrailsConfig
      description: Guardrails configuration
      nullable: true
      properties:
        enabled:
          type: boolean
          description: Controls whether guardrails are enabled
        response_when_unsafe:
          type: string
          description: The response when the guardrails model marks the completion as unsafe
          example: Response filtered by Cortex Guard
    Image:
      type: object
      description: reserved
      properties:
        type:
          type: string
          enum:
          - image
        details:
          $ref: '#/components/schemas/ImageDetails'
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ImageDetails:
      type: object
      description: reserved
      properties:
        type:
          type: string
          description: Whether the image content is base64.
          enum:
          - base64
        content:
          type: string
          description: base64 encoded image.
        content_type:
          type: string
          description: Type of image.
          enum:
          - image/jpeg
          - image/jpg
          - image/png
          - image/gif
          - image/webp
          - image/heic
          - image/heif
        detail:
          type: string
          description: Level of detail to process the image. Only applicable for OpenAI models
          enum:
          - auto
          - low
          - high
    CacheControl:
      description: reserved
      type: object
      nullable: true
      properties:
        type:
          type: string
          description: "Identifies the type of cache control.\n\u201Cephemeral\u201D is the only supported\
            \ cache type currently, which has a 5-minute lifetime.\n"
          enum:
          - ephemeral
    ToolChoice:
      type: object
      nullable: true
      description: 'Configures how tools should be selected and used during the interaction.

        Controls whether tool use is automatic, required, or specific tools should be used.'
      required:
      - type
      properties:
        type:
          type: string
          description: 'Determines how tools are selected:

            * auto - Automatic tool selection (default)

            * required - Must use at least one tool

            * tool - Use specific named tools'
          example: required
        name:
          type: array
          description: List of specific tool names to use when type is 'tool'
          example:
          - Analyst1
          - Search1
          items:
            type: string
    TextContent:
      type: object
      description: 'Represents plain text content in a message.

        Used for simple text exchanges and natural language responses.'
      required:
      - type
      - text
      properties:
        type:
          type: string
          description: Identifies this as text content.
          enum:
          - text
        text:
          type: string
          description: The actual text content of the message.
          example: Based on the analysis, our top three customers by revenue are Acme Corp ($1.2M), TechGiant
            ($980K), and MegaCorp ($875K).
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    StreamingTextContent:
      type: object
      description: 'Represents plain text content in a message.

        Used for simple text exchanges and natural language responses.'
      properties:
        type:
          type: string
          description: Identifies this as text content.
          enum:
          - text
        content:
          type: string
          description: The actual text content of the message.
          example: Based on the analysis, our top three customers by revenue are Acme Corp ($1.2M), TechGiant
            ($980K), and MegaCorp ($875K).
    JSONContent:
      type: object
      description: Represents structured JSON data in a message
      required:
      - type
      - json
      properties:
        type:
          type: string
          description: Identifies this as JSON content
          enum:
          - json
        json:
          type: object
          description: Arbitrary JSON data structure
          example:
            key: value
            numbers:
            - 1
            - 2
            - 3
          additionalProperties: true
    ToolResults:
      type: object
      description: 'Represents the results of a tool execution. Contains both the input parameters

        and output results from the tool execution.'
      required:
      - type
      - tool_results
      properties:
        type:
          type: string
          description: Identifies this as tool results content
          enum:
          - tool_results
        tool_results:
          type: object
          description: Container for tool execution results and metadata
          required:
          - tool_use_id
          - name
          - content
          properties:
            tool_use_id:
              type: string
              description: Unique identifier linking this result to its corresponding tool use request
              example: tool_123456
            name:
              type: string
              description: Name of the tool that was executed. Must match a tool name from the tools array
              example: Analyst1
            content:
              type: array
              description: Array of content elements produced by the tool execution
              example:
              - type: json
                json:
                  sql_query: SELECT * FROM sales LIMIT 10
              - type: text
                text: Query generated successfully
              items: {}
            status:
              type: string
              description: status indicators for the tool execution
              example: success
            result:
              type: object
              description: Additional result data in an arbitrary structure
              example:
                query_id: abc123
                row_count: 150
              additionalProperties: true
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ToolUse:
      type: object
      description: 'Represents a request to use a specific tool. Contains the tool identifier

        and input parameters for the execution.'
      required:
      - type
      - tool_use
      properties:
        type:
          type: string
          description: Identifies this as a tool use request
          enum:
          - tool_use
        tool_use:
          type: object
          description: Container for tool use request details
          required:
          - tool_use_id
          - name
          - input
          properties:
            tool_use_id:
              type: string
              description: Unique identifier for this tool use request
              example: tool_001
            name:
              type: string
              description: Name of the tool to execute. Must match a tool name from the tools array
              example: Analyst1
            input:
              type: object
              description: Input parameters for the tool execution
              example:
                query: What are the top selling products?
                limit: 5
              additionalProperties: true
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    StreamingToolUse:
      type: object
      description: 'Represents a request to use a specific tool. Contains the tool identifier

        and input parameters for the execution.'
      properties:
        tool_use_id:
          type: string
          description: Unique identifier for this tool use request
        name:
          type: string
          description: Name of the tool to execute. Must match a tool name from the tools array
        input:
          type: string
    Tool:
      type: object
      description: 'Defines a tool that can be used by the agent.

        Tools provide specific capabilities like data analysis, search, or generic functions.'
      required:
      - tool_spec
      properties:
        tool_spec:
          type: object
          description: Specification of the tool's type, configuration, and input requirements
          required:
          - type
          - name
          properties:
            type:
              type: string
              description: 'The type of tool capability. Can be specialized types like

                ''cortex_analyst_text_to_sql'' or ''generic'' for general-purpose tools.'
              example: generic
            name:
              type: string
              description: 'Unique identifier for referencing this tool instance.

                Used to match with configuration in tool_resources.'
              example: get_weather
            description:
              type: string
              description: Description of the tool to be considered for tool use
            input_schema:
              type: object
              description: 'JSON Schema definition of the expected input parameters for this tool.

                Required for generic tools to specify their input requirements.'
              properties:
                type:
                  type: string
                  description: The type of the input schema object
                  example: object
                properties:
                  type: object
                  description: Definitions of each input parameter
                required:
                  type: array
                  description: List of required input parameter names
                  items:
                    type: string
              additionalProperties: true
              example:
                type: object
                properties:
                  location:
                    type: string
                    description: The city and state, e.g. San Francisco, CA
                required:
                - location
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    OpenAIOutput:
      type: object
      description: OpenAI specific output.
      properties:
        reasoning:
          $ref: '#/components/schemas/OpenAIReasoning'
    OpenAIReasoning:
      type: object
      nullable: true
      description: OpenAI reasoning output.
      properties:
        summary:
          type: string
          description: Reasoning summary tokens generated during the model response.
        encrypted_content:
          type: string
          description: 'The encrypted_content field is an opaque field and should not be interpreted or
            parsed.

            It should only be used for verifying that the reasoning blocks were generated by that specific
            model.'
      required:
      - summary
      - encrypted_content
    AnthropicThinking:
      type: object
      nullable: true
      description: Anthropic thinking output.
      properties:
        thinking:
          type: string
          description: 'Thinking tokens generated during the model response.

            This field can also be used in the follow-up requests to continue the conversation.'
        signature:
          type: string
          description: 'The signature field is an opaque field and should not be interpreted or parsed.

            It should only be used for verifying that the thinking blocks were generated by that specific
            model.'
      required:
      - thinking
      - signature
    StreamingOpenAIReasoning:
      type: object
      nullable: true
      description: OpenAI reasoning output.
      properties:
        summary:
          type: string
          description: Reasoning summary tokens generated during the model response.
          nullable: true
        encrypted_content:
          type: string
          description: 'The encrypted_content field is an opaque field and should not be interpreted or
            parsed.

            It should only be used for verifying that the reasoning blocks were generated by that specific
            model.'
          nullable: true
    StreamingAnthropicThinking:
      type: object
      nullable: true
      description: Anthropic thinking output.
      properties:
        thinking:
          type: string
          description: 'Thinking tokens generated during the model response.

            This field can also be used in the follow-up requests to continue the conversation.'
          nullable: true
        signature:
          type: string
          description: 'The signature field is an opaque field and should not be interpreted or parsed.

            It should only be used for verifying that the thinking blocks were generated by that specific
            model.'
          nullable: true
    StreamingCompleteResponse:
      type: object
      description: Server-sent events for streaming text-completion updates.
      x-events:
        data:
          $ref: '#/components/schemas/StreamingCompleteResponseDataEvent'
    StreamingCompleteResponseDataEvent:
      type: object
      description: Streaming text-completion response event.
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              delta:
                $ref: '#/components/schemas/StreamingCompleteResponseDelta'
    StreamingCompleteResponseDelta:
      type: object
      required:
      - type
    EmbedRequest:
      type: object
      description: Request to calculate text embeddings using a specified model.
      properties:
        model:
          type: string
          description: "Identifier of the model to use for generating embeddings.\nRefer to Snowflake\
            \ documentation for the list of supported models.\n\nExamples:\n  - `snowflake-arctic-embed-m`\n\
            \  - `snowflake-arctic-embed-m-v1.5`\n"
        text:
          type: array
          items:
            type: string
          description: 'An array of input texts for which vector embeddings will be calculated.

            Example: ["Hello world", "Machine learning is fascinating"]'
          minItems: 1
        provisioned_throughput_id:
          type: string
          description: The provisioned throughput ID to be used with the request.
          nullable: true
      required:
      - model
      - text
    EmbedResponse:
      type: object
      properties:
        object:
          type: string
          description: Type of the response object
          enum:
          - list
        data:
          type: array
          description: List of embedding objects
          items:
            type: object
            properties:
              object:
                type: string
                description: Type of the embedding object
                enum:
                - embedding
              embedding:
                type: array
                description: Nested array of floating-point numbers representing the embedding vector
                items:
                  type: array
                  items:
                    type: number
                    format: float
              index:
                type: integer
                description: Index of the embedding in the input array
            required:
            - object
            - embedding
            - index
        model:
          type: string
          description: Name of the embedding model used
        usage:
          type: object
          properties:
            total_tokens:
              type: integer
              description: Total number of tokens processed
      required:
      - object
      - data
      - model
      - usage
    QueryStatus:
      type: object
      properties:
        code:
          type: string
        sqlState:
          type: string
        message:
          type: string
        statementHandle:
          type: string
          format: uuid
        createdOn:
          type: integer
          format: int64
          description: Timestamp that specifies when the statement execution started. The timestamp is
            expressed in milliseconds since the epoch.
          example: 1597090533987
        statementStatusUrl:
          type: string
          format: uri
          description: URL that you can use to check the status of the execution of the statement and
            the result set.
      required:
      - statementHandle
      example:
        code: '000000'
        sqlState: '00000'
        message: successfully executed
        statementHandle: e4ce975e-f7ff-4b5e-b15e-bf25f59371ae
        createdOn: 1597090533987
    QueryFailureStatus:
      type: object
      properties:
        code:
          type: string
        sqlState:
          type: string
        message:
          type: string
        statementHandle:
          type: string
          format: uuid
        createdOn:
          type: integer
          format: int64
          description: "Timestamp that specifies when the statement execution started.\u200C The timestamp\
            \ is expressed in milliseconds since the epoch."
          example: 1597090533987
        statementStatusUrl:
          type: string
          format: uri
      required:
      - message
      - statementHandle
      example:
        code: '000123'
        sqlState: '42601'
        message: SQL compilation error
        statementHandle: e4ce975e-f7ff-4b5e-b15e-bf25f59371ae
        createdOn: 1597090533987
    CancelStatus:
      type: object
      properties:
        code:
          type: string
        sqlState:
          type: string
        message:
          type: string
        statementHandle:
          type: string
          format: uuid
        statementStatusUrl:
          type: string
          format: uri
      required:
      - statementHandle
      example:
        message: successfully canceled
        statementHandle: 536fad38-b564-4dc5-9892-a4543504df6c
    ResultSet:
      type: object
      properties:
        code:
          type: string
          example: '000123'
        sqlState:
          type: string
          example: '42601'
        message:
          type: string
          example: successfully executed
        statementHandle:
          type: string
          format: uuid
          example: 536fad38-b564-4dc5-9892-a4543504df6c
        createdOn:
          type: integer
          format: int64
          description: "Timestamp that specifies when the statement execution started.\u200C The timestamp\
            \ is expressed in milliseconds since the epoch.\u200C"
          example: 1597090533987
        statementStatusUrl:
          type: string
          format: uri
        resultSetMetaData:
          type: object
          properties:
            format:
              type: string
              enum:
              - jsonv2
              description: For v2 endpoints the only possible value for this field is jsonv2.
              example: jsonv2
            numRows:
              type: integer
              format: int64
              description: The total number of rows of results.
              example: 100
            rowType:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  length:
                    type: integer
                    format: int64
                    minimum: 0
                  precision:
                    type: integer
                    format: int64
                    minimum: 0
                  scale:
                    type: integer
                    format: int64
                    minimum: 0
                  nullable:
                    type: boolean
              example:
              - name: ROWNUM
                type: FIXED
                length: 0
                precision: 38
                scale: 0
                nullable: false
              - name: ACCOUNT_ID
                type: FIXED
                length: 0
                precision: 38
                scale: 0
                nullable: false
              - name: ACCOUNT_NAME
                type: TEXT
                length: 1024
                precision: 0
                scale: 0
                nullable: false
              - name: ADDRESS
                type: TEXT
                length: 16777216
                precision: 0
                scale: 0
                nullable: true
              - name: ZIP
                type: TEXT
                length: 100
                precision: 0
                scale: 0
                nullable: true
              - name: CREATED_ON
                type: TIMESTAMP_NTZ
                length: 0
                precision: 0
                scale: 3
                nullable: false
            partitionInfo:
              description: Partition information
              type: array
              minItems: 0
              items:
                type: object
                properties:
                  rowCount:
                    type: integer
                    format: int64
                    description: Number of rows in the partition.
                    minimum: 0
                    example: 1324
                  compressedSize:
                    type: integer
                    format: int64
                    description: the partition size before the decompression. This may or may not be present
                      in the partitionInfo. Uncompressed size would always be there.
                    minimum: 0
                    example: 37436824
                  uncompressedSize:
                    type: integer
                    format: int64
                    description: the partition size after the decompression
                    minimum: 0
                    example: 1343787384
            nullable:
              description: false if null is replaced with a string 'null' otherwise false
              type: boolean
            parameters:
              type: object
              properties:
                binary_output_format:
                  type: string
                  example: HEX
                date_output_format:
                  type: string
                  example: YYYY-MM-DD
                time_output_format:
                  type: string
                  example: HH24:MI:SS
                timestamp_output_format:
                  type: string
                  example: YYYY-MM-DD HH24:MI:SS.FF6
                timestamp_ltz_output_format:
                  type: string
                  example: YYYY-MM-DD HH24:MI:SS.FF6
                timestamp_ntz_output_format:
                  type: string
                  example: YYYY-MM-DD HH24:MI:SS.FF6
                timestamp_tz_output_format:
                  type: string
                  example: YYYY-MM-DDTHH24:MI:SS.FF6 TZHTZM
                multi_statement_count:
                  type: integer
                  example: 4
        data:
          description: Result set data.
          type: array
          minItems: 0
          items:
            type: array
            minItems: 0
            items:
              type: string
              nullable: true
              minItems: 0
          example:
          - - customer1
            - 1234 A Avenue
            - '98765'
            - '2019-08-10 23:56:34.123'
          - - customer2
            - 987 B Street
            - '98765'
            - '2019-08-11 09:45:12.890'
          - - customer3
            - 8777 C Blvd
            - '98765'
            - '2019-08-12 10:23:51.999'
          - - customer4
            - 64646 D Circle
            - '98765'
            - '2019-08-13 01:54:32.000'
        stats:
          type: object
          description: these stats might not be available for each request.
          properties:
            numRowsInserted:
              type: integer
              format: int64
              description: Number of rows that were inserted.
              minimum: 0
              example: 12
            numRowsUpdated:
              type: integer
              format: int64
              description: Number of rows that were updated.
              minimum: 0
              example: 9
            numRowsDeleted:
              type: integer
              format: int64
              description: Number of rows that were deleted.
              minimum: 0
              example: 8
            numDuplicateRowsUpdated:
              type: integer
              format: int64
              description: Number of duplicate rows that were updated.
              minimum: 0
              example: 20
  responses:
    200SuccessResponse:
      description: Successful request.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    202SuccessAcceptedResponse:
      headers:
        Location:
          schema:
            type: string
            description: Relative path for checking request status or getting the result, if available.
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      description: Successfully accepted the request, but it is not completed yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessAcceptedResponse'
    400BadRequest:
      description: Bad Request. The request payload is invalid or malformed. This happens if the application
        didn't send the correct request payload. The response body may include the error code and message
        indicating the actual cause. The application must reconstruct the request body for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Unauthorized. The request is not authorized. This happens if the attached access token
        is invalid or missing. The response body may include the error code and message indicating the
        actual cause, e.g., expired, invalid token. The application must obtain a new access token for
        retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Forbidden. The request is forbidden. This can also happen if the request is made even
        if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Not Found. The request endpoint is not valid. This happens if the API endpoint does
        not exist, or if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    405MethodNotAllowed:
      description: Method Not Allowed. The request method doesn't match the supported API. This happens,
        for example, if the application calls the API with GET method but the endpoint accepts only POST.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    408RequestTimeout:
      description: Request Timeout. This indicates that the request from the client timed out and was
        not completed by the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflict. The requested operation could not be performed due to a conflicting state
        that could not be resolved. This usually happens when a CREATE request was performed when there
        is a pre-existing resource with the same name, and also without one of the options orReplace/ifNotExists.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    410Gone:
      description: Gone. This error is primarily intended to assist the task of web maintenance by notifying
        the recipient that the resource is intentionally unavailable.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    415UnsupportedMediaType:
      description: The request header Content-Type includes an unsupported media type. The API supports
        application/json only. If none specified, the request payload is taken as JSON, but if any other
        media type is specified, this error is returned.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429LimitExceeded:
      description: Limit Exceeded. The number of requests hit the rate limit. The application must slow
        down the frequency of hitting the API endpoints.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalServerError:
      description: Internal Server Error. The server hit an unrecoverable system error. The response body
        may include the error code and message for further guidance. The application owner may need to
        reach out the customer support.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Service Unavailable. The request was not processed due to server side timeouts. The
        application may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    504GatewayTimeout:
      description: Gateway Timeout. The request was not processed due to server side timeouts. The application
        may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    X-Snowflake-Request-ID:
      description: Unique ID of the API request.
      schema:
        type: string
        format: uuid
    Link:
      description: Links to the page of results (e.g. the first page, the last page, etc.). The header
        can include multiple 'url' entries with different 'rel' attribute values that specify the page
        to return ('first', 'next', 'prev', and 'last').
      schema:
        type: string
        example: </api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=0>; rel="first",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=1>;
          rel="next",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=9>; rel="last"
  requestBodies: {}
  examples: {}
