openapi: 3.0.0
info:
  title: Snowflake REST API v2
  version: 2.0.0
  description: "Snowflake REST API \u2014 packaged for UiPath Integration Service. v2 covers Cortex Analyst\
    \ (sendMessage), Cortex Search (query, suggest), Cortex Inference (complete), Cortex Embed (embed),\
    \ Cortex OpenAI-compat (chat/completions), Cortex Anthropic-compat (messages), SQL API (statements),\
    \ and Cortex Agents (threads, agent objects, agent run). Auth: Snowflake-native OAuth 2.0 Authorization\
    \ Code. Connection-level fields supply default Snowflake context (account, warehouse, database, schema,\
    \ role); per-call parameters allow per-request overrides."
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
  license:
    name: Snowflake Developer Policy
    url: https://www.snowflake.com/legal/developer-policy/
servers:
- url: https://{account}.snowflakecomputing.com
  description: Snowflake account endpoint
  variables:
    account:
      default: MDTPLC-AWSUSE1P1
      description: Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1). No '.snowflakecomputing.com'
        suffix.
      x-ms-connection-parameter:
        name: account
        uiDefinition:
          displayName: Snowflake Account
          description: Your Snowflake account identifier (e.g. MDTPLC-AWSUSE1P1)
          tooltip: Find under Admin > Accounts or run SELECT CURRENT_ACCOUNT() in Snowflake
          constraints:
            required: 'true'
security:
- SnowflakeOAuth:
  - session:role:DEV_FDH_PROJ_MGMT_RW
tags: []
paths:
  /api/v2/cortex/analyst/feedback:
    post:
      operationId: cortexAnalyst_sendFeedback
      tags:
      - cortex-analyst
      description: Send a user feedback of Cortex Analyst response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFeedbackRequest'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      summary: Send Analyst Feedback
    parameters:
    - &id001
      $ref: '#/components/parameters/SnowflakeAuthorizationTokenType'
    - &id002
      $ref: '#/components/parameters/SnowflakeRole'
    - &id003
      $ref: '#/components/parameters/SnowflakeWarehouse'
    - &id004
      $ref: '#/components/parameters/SnowflakeDatabase'
    - &id005
      $ref: '#/components/parameters/SnowflakeSchema'
  /api/v2/cortex/analyst/message:
    post:
      operationId: cortexAnalyst_sendMessage
      tags:
      - cortex-analyst
      summary: Send a data question to the Cortex Analyst
      description: Send a data question to the Cortex Analyst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
